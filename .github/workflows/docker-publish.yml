name: Docker Build & Publish

'on':
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - 'backend/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'agents/**'
      - 'skills/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  build-backend:
    name: Build Backend Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend target
        run: docker build --target backend -f docker/Dockerfile -t carefold/backend:latest .

  build-web:
    name: Build Web Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web target
        run: docker build --target web -f docker/Dockerfile -t carefold/web:latest .
